# ============================================================================
# reprox — example configuration
#
# The path to this file can be overridden with the REPROX_CONFIG environment
# variable. Every field below can likewise be overridden by an
# environment variable named REPROX_<FIELD_NAME_UPPERCASE> (see README.md) —
# handy for systemd/docker so you don't have to keep paths/secrets on disk.
#
# IMPORTANT: in TOML, once an [[routes]] array-of-tables header appears,
# every later bare `key = value` line attaches to the *last* routes entry,
# not to the top-level document. So all top-level scalar fields below
# MUST come before the [[routes]] blocks — do not move them after.
#
# Sending the running process SIGHUP reloads this file, tls_cert_path/
# tls_key_path, and static_dir without dropping any connection already
# in flight (see README.md, "Reloading without a restart"). listen_addr,
# metrics_addr, tls_min_version, and max_connections are the exception —
# changing those still needs a full restart.
# ============================================================================

# Address the front server itself listens on. Port 443 requires either
# root or CAP_NET_BIND_SERVICE on the binary (see README.md).
listen_addr = "0.0.0.0:443"

# Certificate (full chain, PEM) and private key (PEM) for the fallback
# site. The certificate must be issued for the domain this VPS resolves
# to (e.g. Let's Encrypt: /etc/letsencrypt/live/<domain>/fullchain.pem).
tls_cert_path = "/etc/reprox/certs/fullchain.pem"
tls_key_path = "/etc/reprox/certs/privkey.pem"

# Directory containing the static fallback site (index.html is required
# at the root; 404.html is optional — otherwise a minimal built-in page
# is used).
static_dir = "/etc/reprox/static"

# Value of the Server header in fallback site responses.
server_header = "nginx/1.26.2 (Ubuntu)"

# Timeout (seconds) for reading/parsing the ClientHello and for the
# fallback path's TLS handshake. Protects against stuck/slowloris-style
# connections. Must be greater than 0 (enforced at startup).
handshake_timeout_secs = 10

# TLS profile for the fallback site:
#   "1.2" — Mozilla Intermediate (TLS 1.2 + TLS 1.3, maximum compatibility)
#   "1.3" — Mozilla Modern (TLS 1.3 only)
tls_min_version = "1.2"

# (optional) address of the internal plain-text metrics endpoint.
# MUST be a loopback address (127.0.0.1 / ::1) — the server refuses to
# start if you set anything else. If commented out, metrics are disabled
# and no extra port is opened at all.
metrics_addr = "127.0.0.1:9090"

# (optional, default 10000) hard cap on connections handled at once,
# across both routes combined. Once this many connections are in flight,
# new ones simply queue in the kernel's accept backlog until a slot
# frees up, instead of being accepted without limit and exhausting file
# descriptors or memory — the same role nginx's `worker_connections`
# plays. Must be greater than 0 (enforced at startup). Each proxied
# connection holds two sockets (client + upstream), so raise this with
# that in mind if you also raise the process's file descriptor limit.
max_connections = 10000

# One [[routes]] block per hidden service. If the SNI of an incoming TLS
# connection matches a route's `sni`, the connection is transparently
# proxied to that route's `upstream` (no TLS termination on this side).
# Each `sni` must be unique; both fields are required and may not be empty.
# `upstream` must look like a valid "host:port" (checked at startup —
# no "https://" prefix, no trailing path, a real port number); this does
# NOT resolve hostnames, so a typo'd-but-well-formed hostname is only
# caught the first time a connection actually tries to use it.
# NOTE: keep all [[routes]] blocks at the end of the file, after every
# top-level scalar field above (see the TOML ordering warning at the top).
[[routes]]
sni = "domain.com"
upstream = "127.0.0.1:8080"

[[routes]]
sni = "api.domain.com"
upstream = "127.0.0.1:4443"
