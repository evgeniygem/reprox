<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="netTitle">
  <title id="netTitle">Schematic illustration of a distributed network infrastructure</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1440"/>
      <stop offset="1" stop-color="#122064"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#2c55e8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2c55e8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="420" rx="18" fill="url(#bg)"/>
  <rect width="640" height="420" rx="18" fill="url(#glow)"/>

  <g stroke="#4a63c9" stroke-width="1.2" opacity="0.65">
    <line x1="120" y1="120" x2="260" y2="90"/>
    <line x1="120" y1="120" x2="150" y2="240"/>
    <line x1="260" y1="90" x2="400" y2="130"/>
    <line x1="260" y1="90" x2="330" y2="220"/>
    <line x1="400" y1="130" x2="500" y2="95"/>
    <line x1="400" y1="130" x2="470" y2="250"/>
    <line x1="150" y1="240" x2="330" y2="220"/>
    <line x1="330" y1="220" x2="470" y2="250"/>
    <line x1="330" y1="220" x2="300" y2="330"/>
    <line x1="150" y1="240" x2="200" y2="340"/>
    <line x1="470" y1="250" x2="420" y2="340"/>
    <line x1="200" y1="340" x2="300" y2="330"/>
    <line x1="300" y1="330" x2="420" y2="340"/>
    <line x1="500" y1="95" x2="560" y2="180"/>
    <line x1="470" y1="250" x2="560" y2="180"/>
  </g>

  <g fill="#eef1ff">
    <circle cx="120" cy="120" r="5"/>
    <circle cx="260" cy="90" r="4"/>
    <circle cx="400" cy="130" r="6"/>
    <circle cx="500" cy="95" r="4"/>
    <circle cx="560" cy="180" r="4.5"/>
    <circle cx="150" cy="240" r="4"/>
    <circle cx="330" cy="220" r="7" fill="#4ee08a"/>
    <circle cx="470" cy="250" r="4.5"/>
    <circle cx="200" cy="340" r="4"/>
    <circle cx="300" cy="330" r="4.5"/>
    <circle cx="420" cy="340" r="4"/>
  </g>

  <g fill="none" stroke="#4ee08a" stroke-width="1.5" opacity="0.7">
    <circle cx="330" cy="220" r="14"/>
  </g>
</svg>
